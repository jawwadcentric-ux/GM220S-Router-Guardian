name: Build unsigned release APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GM220S_Android_App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile and lint release
        run: gradle assembleRelease lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: GM220S-Guardian-unsigned-release
          path: GM220S_Android_App/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
