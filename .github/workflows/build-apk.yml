name: Build Android APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GM220S_Android_App

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug lintDebug

      - name: Verify router protocol fixture
        working-directory: .
        run: |
          mkdir -p tests/build
          javac -d tests/build GM220S_Android_App/app/src/main/java/com/metawebdesigner/gm220rebooter/RouterClient.java tests/ProtocolBaselineTest.java
          java -Dsun.net.http.allowRestrictedHeaders=true -cp tests/build com.metawebdesigner.gm220rebooter.ProtocolBaselineTest
          javac -d tests/build GM220S_Android_App/app/src/main/java/com/metawebdesigner/gm220rebooter/SafetyPolicy.java GM220S_Android_App/app/src/main/java/com/metawebdesigner/gm220rebooter/ScheduleTime.java tests/SafetyAndScheduleTest.java
          java -cp tests/build com.metawebdesigner.gm220rebooter.SafetyAndScheduleTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GM220S-Router-Guardian
          path: GM220S_Android_App/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
